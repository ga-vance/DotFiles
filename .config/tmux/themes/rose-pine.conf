# Rose Pine Moon
# https://rosepinetheme.com/palette

# Backgrounds (low to high)
set -g @thm_bg      "#232136"   # Base
set -g @thm_surface "#2a273f"   # Surface
set -g @thm_overlay "#393552"   # Overlay

# Foregrounds (dim to bright)
set -g @thm_muted   "#6e6a86"   # Muted
set -g @thm_fg      "#908caa"   # Subtle
set -g @thm_text    "#e0def4"   # Text

# Accents
set -g @thm_accent  "#9ccfd8"   # Foam   - primary accent
set -g @thm_prefix  "#c4a7e7"   # Iris   - prefix indicator
set -g @thm_warm    "#ea9a97"   # Rose   - warm secondary
set -g @thm_cool    "#3e8fb0"   # Pine   - cool secondary
set -g @thm_warn    "#f6c177"   # Gold   - warning
set -g @thm_alert   "#eb6f92"   # Love   - alert / error
set -g @thm_success "#a6e3a1"   # (approx) - success
