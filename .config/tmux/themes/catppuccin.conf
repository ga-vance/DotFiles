# Catppuccin Mocha
# https://catppuccin.com/palette

# Backgrounds (low to high)
set -g @thm_bg      "#1e1e2e"   # Base
set -g @thm_surface "#313244"   # Surface 0
set -g @thm_overlay "#45475a"   # Surface 1

# Foregrounds (dim to bright)
set -g @thm_muted   "#6c7086"   # Overlay 0
set -g @thm_fg      "#bac2de"   # Subtext 1
set -g @thm_text    "#cdd6f4"   # Text

# Accents
set -g @thm_accent  "#89b4fa"   # Blue    - primary accent
set -g @thm_prefix  "#cba6f7"   # Mauve   - prefix indicator
set -g @thm_warm    "#f5c2e7"   # Pink    - warm secondary
set -g @thm_cool    "#94e2d5"   # Teal    - cool secondary
set -g @thm_warn    "#f9e2af"   # Yellow  - warning
set -g @thm_alert   "#f38ba8"   # Red     - alert / error
set -g @thm_success "#a6e3a1"   # Green   - success
